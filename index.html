<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS Retraction Monitor · 计算机学科撤稿监测</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <div class="brand-title" data-i18n="brand.title"></div>
      <div class="brand-sub" id="snapshot-line" data-i18n="brand.loading"></div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#overview" data-tab="overview" data-i18n="nav.overview"></a>
    <a href="#rq1" data-tab="rq1" data-i18n="nav.rq1"></a>
    <a href="#journals" data-tab="journals" data-i18n="nav.journals"></a>
    <a href="#records" data-tab="records" data-i18n="nav.records"></a>
    <a href="#rq2" data-tab="rq2" data-i18n="nav.rq2"></a>
    <a href="#rq3" data-tab="rq3" data-i18n="nav.rq3"></a>
    <a href="#methods" data-tab="methods" data-i18n="nav.methods"></a>
  </nav>
  <button class="lang-toggle" id="lang-toggle" type="button"></button>
  <button class="theme-toggle" id="theme-toggle" type="button">◐</button>
</header>

<main>
  <!-- ============ 概览 / Overview ============ -->
  <section class="page" id="page-overview">
    <div class="page-head">
      <h1 data-i18n="ov.h1"></h1>
      <p class="lede" data-i18n-html="ov.lede"></p>
    </div>
    <div class="tiles" id="kpi-tiles"></div>
    <div class="grid-2">
      <div class="card"><h3 data-i18n="ov.findings"></h3><ol class="findings" id="findings"></ol></div>
      <div class="card"><h3 data-i18n="ov.progress"></h3><ul class="roadmap" id="roadmap"></ul></div>
    </div>
    <div class="card" id="card-overview-trend"></div>
    <div class="card">
      <h3><span data-i18n="ov.latest"></span> <span class="muted small" data-i18n="ov.latestSub"></span></h3>
      <div class="table-wrap"><table class="data" id="latest-table"></table></div>
    </div>
  </section>

  <!-- ============ RQ1 ============ -->
  <section class="page" id="page-rq1">
    <div class="page-head">
      <h1 data-i18n="rq1.h1"></h1>
      <p class="lede" data-i18n-html="rq1.lede"></p>
    </div>
    <h2 class="section" data-i18n="rq1.s1"></h2>
    <div class="card" id="card-yearly"></div>
    <div class="card" id="card-publisher-year"></div>
    <h2 class="section" data-i18n="rq1.s2"></h2>
    <div class="grid-2">
      <div class="card" id="card-lorenz"></div>
      <div class="card" id="card-publishers"></div>
    </div>
    <div class="grid-2">
      <div class="card" id="card-batch-dist"></div>
      <div class="card">
        <h3 data-i18n="rq1.batchTable"></h3>
        <p class="sub" data-i18n="rq1.batchTableSub"></p>
        <div class="table-wrap short"><table class="data" id="batch-table"></table></div>
      </div>
    </div>
    <h2 class="section" data-i18n="rq1.s3"></h2>
    <div class="card" id="card-reasons"></div>
    <div class="card" id="card-themes"></div>
    <h2 class="section" data-i18n="rq1.s4"></h2>
    <div class="grid-2">
      <div class="card" id="card-countries"></div>
      <div class="card" id="card-country-year"></div>
    </div>
    <div class="grid-2">
      <div class="card" id="card-lag-hist"></div>
      <div class="card" id="card-lag-year"></div>
    </div>
    <h2 class="section" data-i18n="rq1.s5"></h2>
    <p class="lede" id="rates-lede"></p>
    <div class="card" id="card-rate-year"></div>
    <div class="grid-2">
      <div class="card" id="card-rate-publisher"></div>
      <div class="card">
        <h3 data-i18n="rq1.rateTable"></h3>
        <p class="sub" id="rate-table-sub"></p>
        <div class="table-wrap short"><table class="data" id="rate-table"></table></div>
      </div>
    </div>
  </section>

  <!-- ============ 期刊榜单 / Journals ============ -->
  <section class="page" id="page-journals">
    <div class="page-head">
      <h1 data-i18n="j.h1"></h1>
      <p class="lede" data-i18n="j.lede"></p>
    </div>
    <div class="card"><div class="table-wrap tall"><table class="data sortable" id="journal-table"></table></div></div>
  </section>

  <!-- ============ 记录检索 / Records ============ -->
  <section class="page" id="page-records">
    <div class="page-head">
      <h1 data-i18n="r.h1"></h1>
      <p class="lede" data-i18n="r.lede"></p>
    </div>
    <div class="filters">
      <input type="search" id="q" data-i18n-ph="r.q">
      <select id="f-year"><option value="" data-i18n="r.allYears"></option></select>
      <select id="f-publisher"><option value="" data-i18n="r.allPubs"></option></select>
      <select id="f-reason"><option value="" data-i18n="r.allReasons"></option></select>
      <label class="check"><input type="checkbox" id="f-batch"> <span data-i18n="r.onlyBatch"></span></label>
      <span class="muted small" id="rec-count"></span>
    </div>
    <div class="card"><div class="table-wrap tall"><table class="data" id="rec-table"></table></div>
      <div class="pager"><button id="prev" type="button" data-i18n="r.prev"></button><span id="page-info"></span><button id="next" type="button" data-i18n="r.next"></button></div>
    </div>
  </section>

  <!-- ============ RQ2 ============ -->
  <section class="page" id="page-rq2">
    <div class="page-head">
      <h1><span data-i18n="rq2.h1"></span> <span class="badge run" data-i18n="rq2.badge"></span></h1>
      <p class="lede" data-i18n-html="rq2.lede"></p>
    </div>
    <div class="tiles" id="rq2-tiles"></div>
    <div class="grid-2">
      <div class="card"><h3 data-i18n="rq2.findings"></h3><ol class="findings" id="rq2-findings"></ol></div>
      <div class="card"><h3 data-i18n="rq2.tiers"></h3><p class="sub" data-i18n="rq2.tiersSub"></p><table class="data" id="tier-table"></table></div>
    </div>
    <div class="card" id="card-aigc-pub"></div>
    <div class="grid-2">
      <div class="card" id="card-aigc"></div>
      <div class="card" id="card-text-coverage"></div>
    </div>
    <div class="grid-2">
      <div class="card"><h3 data-i18n="rq2.mech"></h3><p class="sub" id="mech-sub"></p><table class="data" id="mech-table"></table></div>
      <div class="card"><h3 data-i18n="rq2.post"></h3><p class="sub" id="post-sub"></p><table class="data" id="post-table"></table></div>
    </div>
    <div class="card"><h3 data-i18n="rq2.plan"></h3><ul class="plain" data-i18n-html="rq2.planList"></ul></div>
  </section>

  <!-- ============ RQ3 ============ -->
  <section class="page" id="page-rq3">
    <div class="page-head">
      <h1><span data-i18n="rq3.h1"></span> <span class="badge run" data-i18n="rq3.badge"></span></h1>
      <p class="lede" data-i18n-html="rq3.lede"></p>
    </div>
    <div class="tiles" id="rq3-tiles"></div>
    <div class="card"><h3 data-i18n="rq3.findings"></h3><ol class="findings" id="rq3-findings"></ol></div>
    <div class="grid-2">
      <div class="card" id="card-roc"></div>
      <div class="card"><h3 data-i18n="rq3.methods"></h3><p class="sub" data-i18n="rq3.methodsSub"></p><div class="table-wrap"><table class="data" id="method-table"></table></div></div>
    </div>
    <div class="grid-2">
      <div class="card" id="card-fair"></div>
      <div class="card"><h3 data-i18n="rq3.ppv"></h3><p class="sub" data-i18n="rq3.ppvSub"></p><div class="table-wrap short"><table class="data" id="ppv-table"></table></div></div>
    </div>
    <div class="card">
      <h3 data-i18n="rq3.terms"></h3>
      <div class="grid-2 tight">
        <div><p class="sub" data-i18n="rq3.termsUp"></p><div id="terms-up"></div></div>
        <div><p class="sub" data-i18n="rq3.termsDown"></p><div id="terms-down"></div></div>
      </div>
      <p class="note" data-i18n="rq3.termsNote"></p>
    </div>
    <h2 class="section" data-i18n="rq3.forecast"></h2>
    <p class="lede" data-i18n="rq3.forecastSub"></p>
    <div class="card" id="card-forecast"></div>
    <p class="lede" id="journal-note"></p>
    <div class="grid-2">
      <div class="card"><h3 data-i18n="rq3.harness"></h3><p class="sub" data-i18n="rq3.harnessSub"></p><ol class="plain" data-i18n-html="rq3.harnessSteps"></ol>
<pre>uv run python -m harness.run papers.jsonl --out risk.jsonl
# --llm MODEL  (optional, needs ANTHROPIC_API_KEY)</pre></div>
      <div class="card"><h3 data-i18n="rq3.next"></h3><ul class="plain" data-i18n-html="rq3.nextList"></ul></div>
    </div>
  </section>

  <!-- ============ 方法 / Methods ============ -->
  <section class="page" id="page-methods">
    <div class="page-head"><h1 data-i18n="m.h1"></h1></div>
    <div class="grid-2">
      <div class="card"><h3 data-i18n="m.source"></h3><dl class="kv" id="source-kv"></dl></div>
      <div class="card"><h3 data-i18n="m.flow"></h3><table class="data" id="flow-table"></table></div>
    </div>
    <div class="card"><h3 data-i18n="m.caveats"></h3><ul class="plain" data-i18n-html="m.caveatsList"></ul></div>
    <div class="card"><h3 data-i18n="m.repro"></h3><pre data-i18n="m.repro.code"></pre></div>
  </section>
</main>

<footer class="foot" data-i18n="footer"></footer>

<script src="vendor/echarts.min.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
